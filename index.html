<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hades Alchemy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- ホーム画面 -->
        <div id="screen-home" class="screen active">
            <div class="screen-content">
                <h1>Hades Alchemy</h1>
                <p class="subtitle">宇宙ステーション「ハデス」 調合師のシステム</p>

                <div class="menu-buttons">
                    <button class="btn btn-menu" onclick="showScreen('screen-quest')">
                        <span class="btn-label">依頼</span>
                    </button>
                    <button class="btn btn-menu" onclick="showScreen('screen-crafting')">
                        <span class="btn-label">調合</span>
                    </button>
                    <button class="btn btn-menu" onclick="showScreen('screen-battle')">
                        <span class="btn-label">バトル</span>
                    </button>
                    <button class="btn btn-menu" onclick="showScreen('screen-inventory')">
                        <span class="btn-label">素材管理</span>
                    </button>
                    <button class="btn btn-menu" onclick="showScreen('screen-save')">
                        <span class="btn-label">セーブ/ロード</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 依頼画面 -->
        <div id="screen-quest" class="screen">
            <div class="screen-header">
                <h2>依頼一覧</h2>
                <button class="btn-back" onclick="showScreen('screen-home')">← 戻る</button>
            </div>
            <div class="screen-content">
                <div id="quest-list" class="quest-list"></div>
            </div>
        </div>

        <!-- 調合画面 -->
        <div id="screen-crafting" class="screen">
            <div class="screen-header">
                <h2>調合</h2>
                <button class="btn-back" onclick="showScreen('screen-home')">← 戻る</button>
            </div>
            <div class="screen-content crafting-screen">
                <div class="crafting-left">
                    <h3>レシピ選択</h3>
                    <div id="recipe-list" class="recipe-list"></div>
                </div>
                <div class="crafting-right">
                    <h3>現在のレシピ</h3>
                    <div id="recipe-detail" class="recipe-detail">
                        <p>レシピを選択してください</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- バトル画面 -->
        <div id="screen-battle" class="screen">
            <div class="screen-header">
                <h2>バトル</h2>
                <button class="btn-back" onclick="showScreen('screen-home')">← 戻る</button>
            </div>
            <div class="screen-content battle-screen">
                <div class="battle-top">
                    <div class="battle-player">
                        <p class="battle-label">プレイヤー</p>
                        <div class="hp-bar">
                            <div id="player-hp-fill" class="hp-fill"></div>
                        </div>
                        <p id="player-hp-text" class="hp-text">HP: 100/100</p>
                    </div>
                    <div class="battle-enemy">
                        <p class="battle-label" id="enemy-name">敵</p>
                        <div class="hp-bar">
                            <div id="enemy-hp-fill" class="hp-fill"></div>
                        </div>
                        <p id="enemy-hp-text" class="hp-text">HP: 50/50</p>
                    </div>
                </div>
                <div class="battle-log">
                    <p id="battle-message">バトル開始！</p>
                </div>
                <div class="battle-commands">
                    <button class="btn btn-battle" onclick="playerAttack()">攻撃</button>
                    <button class="btn btn-battle" onclick="playerDefend()">防御</button>
                    <button class="btn btn-battle" onclick="playerEscape()">逃げる</button>
                </div>
            </div>
        </div>

        <!-- 素材管理画面 -->
        <div id="screen-inventory" class="screen">
            <div class="screen-header">
                <h2>素材管理</h2>
                <button class="btn-back" onclick="showScreen('screen-home')">← 戻る</button>
            </div>
            <div class="screen-content">
                <div id="inventory-list" class="inventory-list"></div>
            </div>
        </div>

        <!-- セーブ/ロード画面 -->
        <div id="screen-save" class="screen">
            <div class="screen-header">
                <h2>セーブ/ロード</h2>
                <button class="btn-back" onclick="showScreen('screen-home')">← 戻る</button>
            </div>
            <div class="screen-content save-screen">
                <div class="save-slots">
                    <div class="save-slot">
                        <p>スロット 1</p>
                        <button class="btn btn-save" onclick="quickSave(1)">セーブ</button>
                        <button class="btn btn-load" onclick="quickLoad(1)">ロード</button>
                        <p id="slot-1-info" class="slot-info">空</p>
                    </div>
                    <div class="save-slot">
                        <p>スロット 2</p>
                        <button class="btn btn-save" onclick="quickSave(2)">セーブ</button>
                        <button class="btn btn-load" onclick="quickLoad(2)">ロード</button>
                        <p id="slot-2-info" class="slot-info">空</p>
                    </div>
                    <div class="save-slot">
                        <p>スロット 3</p>
                        <button class="btn btn-save" onclick="quickSave(3)">セーブ</button>
                        <button class="btn btn-load" onclick="quickLoad(3)">ロード</button>
                        <p id="slot-3-info" class="slot-info">空</p>
                    </div>
                </div>

                <hr class="divider">

                <div class="export-import">
                    <h3>データエクスポート/インポート</h3>
                    <div class="export-section">
                        <p>現在のデータをエクスポート:</p>
                        <textarea id="export-data" readonly style="width: 100%; height: 150px;"></textarea>
                        <button class="btn" onclick="exportCurrentData()">エクスポート</button>
                        <button class="btn" onclick="copyToClipboard()">コピー</button>
                    </div>
                    <div class="import-section">
                        <p>データをインポート:</p>
                        <textarea id="import-data" style="width: 100%; height: 150px;"></textarea>
                        <button class="btn" onclick="importData()">インポート</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/crc32.js"></script>
    <script src="js/data.js"></script>
    <script src="js/gameState.js"></script>
    <script src="js/proficiency.js"></script>
    <script src="js/crafting.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/saveSystem.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
